<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Thank You | GCC Ventures India</title>
<meta name="robots" content="noindex"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:wght@300..700&display=swap" rel="stylesheet"/>
<style>
:root{--navy:#080e1c;--orange:#ff9500;--text:#e8e6e0;--muted:#8a8880;--ease:cubic-bezier(.16,1,.3,1);--font-display:'Instrument Serif',Georgia,serif;--font-body:'DM Sans','Helvetica Neue',sans-serif}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-body);background:var(--navy);color:var(--text);min-height:100dvh;display:grid;place-items:center;padding:2rem 1.5rem;line-height:1.65}
.wrap{max-width:560px;text-align:center}
.mark{width:56px;height:56px;margin:0 auto 2rem}
h1{font-family:var(--font-display);font-weight:400;font-size:clamp(2rem,7vw,3.25rem);line-height:1.1;margin-bottom:1rem}
h1 em{font-style:italic;color:var(--orange)}
p{color:var(--muted);margin-bottom:2rem}
a.btn{display:inline-flex;align-items:center;justify-content:center;min-height:52px;padding:.75rem 1.75rem;border-radius:.5rem;background:var(--orange);color:#000;font-size:.9rem;font-weight:600;text-decoration:none}
a.btn:hover{background:#e07800}
a.mail{display:block;margin-top:1.5rem;color:var(--muted);font-size:.85rem}
a.mail b{color:var(--orange);font-weight:600}
</style>
</head>
<body>
<div class="wrap">
 <img class="mark" src="images/logo.svg" alt="GCC Ventures India"/>
  <h1>Message<em>received</em>.</h1>
  <p>Thank you for reaching out. We read every enquiry personally and will reply within one business day.</p>
  <a class="btn" href="index.html">Back to home</a>
    <a class="mail" href="mailto:contact@gccventuresindia.com">Need it sooner? Email <b>contact@gccventuresindia.com</b></a>
</div>
</body>
</html>
