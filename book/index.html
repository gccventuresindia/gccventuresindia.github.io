<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>

  <style>
    :root { --navy:#080e1c;--orange:#ff9500;--teal:#2ec4b6;--text:#e8e6e0;--muted:#8a8880;--font-display:'Instrument Serif',Georgia,serif;--font-body:'DM Sans','Helvetica Neue',sans-serif; }
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:var(--font-body);color:var(--text);background:radial-gradient(ellipse 80% 60% at 50% -10%,oklch(0.28 0.08 240 / 0.5),var(--navy));line-height:1.65;min-height:100dvh;display:flex;align-items:center;justify-content:center;text-align:center;padding:1.5rem}
    main{max-width:640px;display:flex;flex-direction:column;align-items:center;gap:1.5rem}
    .brand{font-size:.8rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--orange)}
    h1{font-family:var(--font-display);font-weight:400;font-size:clamp(2rem,4vw+1rem,3.5rem);line-height:1.08}
    p{color:var(--muted);max-width:52ch;font-size:clamp(1rem,.95rem+.25vw,1.125rem)}
    .btn{display:inline-flex;align-items:center;justify-content:center;min-height:52px;padding:.75rem 2.5rem;border-radius:.5rem;font-size:.95rem;font-weight:600;background:var(--orange);color:#000;text-decoration:none;transition:all 180ms}
    .btn:hover{background:#e07800;transform:translateY(-1px);box-shadow:0 8px 24px oklch(0.6 0.2 50 / 0.3)}
    .footer-note{margin-top:2rem;font-size:.875rem;color:var(--muted)}
    .footer-note a{color:var(--teal);text-decoration:none}
  </style>
</head>
<body>
  <main>
